{% block content %}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p>{{msg}}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
{% endblock %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='scrapeit_styles.css') }}">
</head>
<body>
    <nav>
        <div class="left-section">
            <a href="{{ url_for('home') }}">HOME</a>
            <a href="{{ url_for('search') }}">SEARCH</a>
        </div>
    </nav>


    <div class="search-container">
        <h1>Scrape It</h1>
        <form method="POST">
            <label for="name" class="visually-hidden">Enter URL of website:</label>
            <input type="text" id="name" name="ui" placeholder="Enter a URL to scrape">
        </form>
    </div>
</body>
</html>
